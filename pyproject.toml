[project]
name = "skypro-diplom"
version = "0.1.0"
description = "Дипломный проект в SkyPro."
authors = [
    {name = "Rychard Famichou",email = "rychard.famichou@gmail.com"}
]
requires-python = "^3.12"
dependencies = [
    "django (>=6.0.7,<7.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-filter (>=26.1,<27.0)",
    "drf-yasg (>=1.21.15,<2.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "djoser (>=2.3.3,<3.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.12.0,<5.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "django-stubs (>=6.0.7,<7.0.0)",
    "djangorestframework-stubs (>=3.17.0,<4.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.poetry]
package-mode = false

[tool.black]
line-length = 119
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | venv
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_django = ["django", "rest_framework", "corsheaders"]
known_celery = ["celery", "kombu"]
sections = ["FUTURE", "STDLIB", "DJANGO", "CELERY", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip = ["migrations", ".venv"]

[tool.mypy]
python_version = "3.12"
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main"
]
exclude = ["manage.py"]
strict = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true
check_untyped_defs = false
# Настройки для плагина django-stubs
[tool.django-stubs]
django_settings_module = "config.settings"
# Исключения для автогенерируемого кода
[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true
# Исключения для тестов
[[tool.mypy.overrides]]
module = ["*.tests", "*.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.coverage.run]
omit = [
    "manage.py",
    "**/migrations/**",
    "**/asgi.py",
    "**/wsgi.py",
    "**/settings.py",
    "**/swagger_inspectors.py",
    "**/db_init.py",
    "**/email_backend.py",
]
[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __str__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
skip_empty = true
show_missing = true
fail_under = 80
